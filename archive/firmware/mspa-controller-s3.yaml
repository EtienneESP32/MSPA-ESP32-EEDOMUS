# Contrôleur MSPA – variante ESP32-S3 (DEVKITC-1 N16R8)
# MODE ROLLBACK : On utilise board: esp32dev pour bypasser l'erreur Chip ID mismatch (expected 0)
# Tout en gardant la logique Absolute Sync 3.2 (BIBLE) qui fonctionnait hier.

substitutions:
  mspa_version: "3.2.8"
  eedomus_enabled: !secret eedomus_enabled
  eedomus_host: !secret eedomus_host
  eedomus_api_user: !secret eedomus_api_user
  eedomus_api_secret: !secret eedomus_api_secret
  periph_filtration: !secret eedomus_periph_filtration
  periph_chauffage: !secret eedomus_periph_chauffage
  periph_bulles: !secret eedomus_periph_bulles
  periph_uvc: !secret eedomus_periph_uvc
  periph_verrouillage: !secret eedomus_periph_verrouillage
  periph_consigne_temp: !secret eedomus_periph_consigne_temp
  periph_temp_eau: !secret eedomus_periph_temp_eau

esphome:
  name: mspa-controller-s3
  friendly_name: "MSPA S3 v3.2.8 (PRO)"
  platformio_options:
    board_build.arduino.memory_type: qio_opi
  on_boot:
    - lambda: |-
        id(eedomus_enabled) = (strcmp("${eedomus_enabled}", "true") == 0);
        id(eedomus_reachable) = false;
        id(consigne_setpoint).publish_state(40.0f);
    - delay: 10s
    - if:
        condition:
          lambda: 'return id(eedomus_enabled);'
        then:
          - script.execute: probe_eedomus

  on_loop:
    then:
      - lambda: |-
          if (id(ota_active)) return; // STOP TOUT PENDANT L'OTA
          
          // --- SENS 1 : Clavier -> Moteur (Absolute Sync 3.2.8 / PRO) ---
          static uint8_t c_buf[4], c_idx = 0;
          const int max_trames = 4;
          int n_clav = 0;
          
          while (id(uart_clavier).available() && n_clav < max_trames * 4) {
            uint8_t c; id(uart_clavier).read_byte(&c);
            c_buf[c_idx++] = c;
            if (c_idx == 4) {
              n_clav += 4;
              if (c_buf[0] == 0xA5) {
                uint8_t rid = c_buf[1]; uint8_t rd = c_buf[2];
                // Sync Bi-directionnelle (Clavier -> UI)
                static uint8_t p_h = 0, p_f = 0, p_b = 0, p_uvc = 0;
                if (!id(lock).state) {
                  if (rid == 0x01 && rd == 0x01 && p_h == 0) { id(sw_h).turn_on(); }
                  else if (rid == 0x01 && rd == 0x00 && p_h == 1) { id(sw_h).turn_off(); }
                  else if (rid == 0x02 && rd == 0x01 && p_f == 0) { id(sw_f).turn_on(); }
                  else if (rid == 0x02 && rd == 0x00 && p_f == 1) { id(sw_f).turn_off(); }
                  else if (rid == 0x19 && rd == 0x01 && p_uvc == 0) { id(sw_uvc).turn_on(); }
                  else if (rid == 0x19 && rd == 0x00 && p_uvc == 1) { id(sw_uvc).turn_off(); }
                }
                if (rid == 0x01) p_h = rd; 
                else if (rid == 0x02) p_f = rd;
                else if (rid == 0x19) p_uvc = rd;
                
                // INJECTION PRIORITAIRE
                if (id(pending_uart_id) != 0 && (rid == 0x0D || rid == id(pending_uart_id))) {
                  c_buf[1] = (uint8_t)id(pending_uart_id);
                  c_buf[2] = (uint8_t)id(pending_uart_val);
                  id(pending_uart_id) = 0; 
                } 
                else if (rid == 0x04) {
                  c_buf[2] = (uint8_t)(id(consigne_setpoint).state * 2.0f);
                }
                
                if (id(lock).state && (rid == 0x01 || rid == 0x02 || rid == 0x03 || rid == 0x19)) {
                  c_buf[2] = 0x00;
                }
                
                c_buf[3] = (uint8_t)(c_buf[0] + c_buf[1] + c_buf[2]);
                id(uart_spa).write_array(c_buf, 4);
              }
              c_idx = 0;
            }
          }
          yield();
          
          // --- SENS 2 : Moteur -> Clavier (PRO Relay) ---
          static uint8_t s_buf[4], s_idx = 0;
          static uint32_t last_f = 0, last_h = 0, last_b = 0, last_uvc = 0;
          static uint8_t raw_19 = 0, raw_1A = 0;
          const uint32_t now = millis();
          
          int n_spa = 0;
          while (id(uart_spa).available() && n_spa < max_trames * 4) {
            uint8_t sc; id(uart_spa).read_byte(&sc);
            n_spa++;
            if (s_idx == 0 && sc != 0xA5) continue;
            s_buf[s_idx++] = sc;
            if (s_idx == 4) {
              uint8_t sk = (uint8_t)(s_buf[0] + s_buf[1] + s_buf[2]);
              if (sk == s_buf[3]) {
                uint8_t s_id = s_buf[1]; uint8_t d = s_buf[2];
                if (s_id == 0x06) id(cur_temp).publish_state(d / 2.0f);
                if (s_id == 0x19) { raw_19 = d; if (d == 0x01) last_uvc = now; }
                if (s_id == 0x1B) {
                  if (d == 0) id(sel_b).publish_state("Arret");
                  else if (d == 1) id(sel_b).publish_state("Niveau1");
                  else if (d == 2) id(sel_b).publish_state("Niveau2");
                  else if (d == 3) id(sel_b).publish_state("Niveau3");
                }
                if (s_id == 0x1A) {
                  raw_1A = d;
                  id(raw_1A_val) = d;
                  // OFFSET CALIBRATION DYNAMIQUE
                  uint8_t d_clean = d & (~id(offset_1A)); 
                  
                  if (d_clean & 0x01) { last_f = now; }
                  if (d_clean & 0x02) { last_h = now; }
                  if (d_clean & 0x04) { last_b = now; }
                }
                id(uart_clavier).write_array(s_buf, 4);
              }
              s_idx = 0;
            }
          }
          yield();
          
          // --- CALCUL DES ÉTATS & DEBUG HEXA (Throttlé à 500ms) ---
          static uint32_t last_calc = 0;
          if (now - last_calc > 500) {
            last_calc = now;
            bool is_f = (now - last_f < 2000);
            bool is_h = (now - last_h < 2000);
            bool is_b = (now - last_b < 2000);
            bool is_u = (now - last_uvc < 2000);
            
            static bool p_rf = false, p_rh = false, p_rb = false, p_ru = false;
            if (is_f != p_rf) { id(f_st).publish_state(is_f); p_rf = is_f; }
            if (is_h != p_rh) { id(h_st).publish_state(is_h); p_rh = is_h; }
            if (is_b != p_rb) { id(b_st).publish_state(is_b); p_rb = is_b; }
            if (is_u != p_ru) { id(uvc_st).publish_state(is_u); p_ru = is_u; }
            
            static char h_buf[32];
            sprintf(h_buf, "1A:%02X | 19:%02X", raw_1A, raw_19);
            id(raw_hex).publish_state(h_buf);
          }
          yield();

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
  partitions: huge_app.csv
  flash_size: 16MB

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip:
        static_ip: !secret static_ip
        gateway: !secret gateway
        subnet: !secret subnet
  ap:
    ssid: "MSPA-S3-RECOVERY"

# api: (Désactivé pour libérer des sockets / Error 23)

ota:
  - platform: esphome
    on_begin:
      then:
        - lambda: 'id(ota_active) = true;'
    on_end:
      then:
        - lambda: 'id(ota_active) = false;'

logger:
  level: WARN

web_server:
  port: 80

# captive_portal: (Désactivé pour libérer des sockets / Error 23)

globals:
  - id: ota_active
    type: bool
    initial_value: "false"
  - id: eedomus_enabled
    type: bool
    initial_value: "false"
  - id: eedomus_reachable
    type: bool
    initial_value: "false"
  - id: eedomus_warn_logged
    type: bool
    initial_value: "false"
  - id: pending_uart_id
    type: int
    initial_value: "0"
  - id: pending_uart_val
    type: int
    initial_value: "0"
  - id: raw_1A_val
    type: uint8_t
    initial_value: "0"
  - id: offset_1A
    type: uint8_t
    initial_value: "0"
    restore_value: true
  - id: last_temp_pushed
    type: float
    initial_value: "0.0"
  - id: last_temp_push_time_ms
    type: uint32_t
    initial_value: "0"
  - id: last_consigne_pushed
    type: float
    initial_value: "0.0"
  - id: last_consigne_push_time_ms
    type: uint32_t
    initial_value: "0"

http_request:
  useragent: esphome/mspa-s3
  timeout: 5s

uart:
  - id: uart_spa
    tx_pin: 17
    rx_pin: 16
    baud_rate: 9600
  - id: uart_clavier
    tx_pin: 13
    rx_pin: 14
    baud_rate: 9600

script:
  - id: probe_eedomus
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            static char url[64];
            sprintf(url, "http://%s/api/", "${eedomus_host}");
            return url;
          on_response:
            then:
              - lambda: 'id(eedomus_reachable) = true;'
          on_error:
            then:
              - lambda: 'id(eedomus_reachable) = false;'
text_sensor:
  - platform: template
    name: "MSPA Audit RAW"
    id: raw_hex
    icon: "mdi:hexadecimal"

button:
  - platform: template
    name: "Calibrer Zéro (Flags)"
    icon: "mdi:target-variant"
    on_press:
      then:
        - lambda: |-
            id(offset_1A) = id(raw_1A_val);
            ESP_LOGW("mspa", "CALIBRATION : Nouveau point zéro 1A = 0x%02X", id(offset_1A));

binary_sensor:
  - platform: template
    name: "Etat reel UVC"
    id: uvc_st
    icon: "mdi:check-circle-outline"
  - platform: template
    name: "Etat reel bulles"
    id: b_st
    icon: "mdi:check-circle-outline"
  - platform: template
    name: "Etat reel chauffage"
    id: h_st
    icon: "mdi:check-circle-outline"
  - platform: template
    name: "Etat reel filtration"
    id: f_st
    icon: "mdi:check-circle-outline"

select:
  - platform: template
    name: "Mode bulles"
    id: sel_b
    options: ["Arret", "Niveau1", "Niveau2", "Niveau3"]
    optimistic: true
    set_action:
      then:
        - lambda: |-
            int val = 0;
            if (x == "Niveau1") val = 1;
            else if (x == "Niveau2") val = 2;
            else if (x == "Niveau3") val = 3;
            id(pending_uart_id) = 0x03;
            id(pending_uart_val) = val;

switch:
  - platform: template
    name: "Filtration"
    id: sw_f
    optimistic: true
    on_turn_on:
      then:
        - lambda: |-
            id(pending_uart_id) = 0x02;
            id(pending_uart_val) = 0x01;
    on_turn_off:
      then:
        - lambda: |-
            id(pending_uart_id) = 0x02;
            id(pending_uart_val) = 0x00;
  - platform: template
    name: "Chauffage"
    id: sw_h
    optimistic: true
    on_turn_on:
      then:
        - lambda: |-
            id(pending_uart_id) = 0x01;
            id(pending_uart_val) = 0x01;
    on_turn_off:
      then:
        - lambda: |-
            id(pending_uart_id) = 0x01;
            id(pending_uart_val) = 0x00;
  - platform: template
    name: "UVC"
    id: sw_uvc
    optimistic: true
    on_turn_on:
      then:
        - lambda: |-
            id(pending_uart_id) = 0x19;
            id(pending_uart_val) = 0x01;
    on_turn_off:
      then:
        - lambda: |-
            id(pending_uart_id) = 0x19;
            id(pending_uart_val) = 0x00;
  - platform: template
    name: "Verrouillage clavier"
    id: lock
    optimistic: true

sensor:
  - platform: template
    name: "Temperature eau"
    id: cur_temp
    unit_of_measurement: "°C"
    update_interval: never

number:
  - platform: template
    name: "Temperature consigne"
    id: consigne_setpoint
    min_value: 20
    max_value: 40
    step: 0.5
    unit_of_measurement: "°C"
    set_action:
      then: []
