# Sniffer / Audit UART MSPA – pont transparent, préfixes [BOOT] [+Nms] [apres 0x0D], IDs 0x08/0x0D nommés.
# Décodage de chaque trame 0xA5 : checksum, sens, ID connu/inconnu.
# Même câblage que le contrôleur ; pas d’injection, uniquement lecture + logs (ou envoi vers un serveur).
# Référence : docs/protocol_mspa.md, docs/test_plan.md
#
# À compléter avec ton code d’audit (ex. uart_debug, envoi HTTP des trames, etc.).
# On peut le faire évoluer en parallèle du mspa-controller.yaml dans le même dépôt.

esphome:
  name: mspa-uart-sniffer
  friendly_name: MSPA UART Sniffer

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      # Force 20 MHz, optimise la stabilité radio
      CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED: "y"
      CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED: "y"
      CONFIG_ESP_WIFI_TX_BA_WIN: "6"
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_COMPILER_OPTIMIZATION_SIZE: "y"

globals:
  - id: last_trame_ms
    type: int
    restore_value: false
  - id: last_rid
    type: int
    restore_value: false
  - id: first_trame_done
    type: bool
    restore_value: false
  - id: auto_step
    type: int
    initial_value: "0"

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap: { ssid: "MSPA-SNIFFER-RECOVERY" }

ota:
  platform: esphome

# Pour récupérer les logs à distance (esphome logs --device <IP>)
api:

# UI : voir la dernière trame décodée en direct (pas de surcharge notable)
web_server:
captive_portal:

# Dernière trame décodée, mise à jour à chaque trame (affichée dans l'UI)
text_sensor:
  - platform: template
    name: "Dernière trame"
    id: last_trame
    icon: "mdi:code-braces"

logger:
  level: INFO
  baud_rate: 0

uart:
  - id: uart_spa
    tx_pin: 17
    rx_pin: 16
    baud_rate: 9600
    rx_buffer_size: 1024
    debug:
      direction: BOTH
      after: { bytes: 4 }
      sequence:
        - lambda: |-
            if (bytes.size() != 4 || bytes[0] != 0xA5) {
              UARTDebug::log_hex(direction, bytes, ' ');
              return;
            }
            uint8_t id = bytes[1], data = bytes[2], cs = bytes[3];
            uint8_t expect_cs = (0xA5 + id + data) & 0xFF;
            const char* dir_str = (direction == 0) ? "SPA->CLAV" : "CLAV->SPA";
            char buf[96];
            char extra[32] = "";
            if (expect_cs != cs) {
              snprintf(buf, sizeof(buf), "[%s] A5 %02X %02X %02X (checksum ERR)", dir_str, id, data, cs);
              ESP_LOGI("mspa", "%s", buf);
              id(last_trame).publish_state(std::string(buf));
              return;
            }
            uint32_t now = millis();
            char prefix[48] = "";
            if (!id(first_trame_done)) { strcat(prefix, "[BOOT] "); id(first_trame_done) = true; }
            if (id(last_rid) == 0x0D) strcat(prefix, "[apres 0x0D] ");
            if (id(first_trame_done)) {
              uint32_t delta = now - (uint32_t)id(last_trame_ms);
              char pre2[20]; snprintf(pre2, sizeof(pre2), "[+%ums] ", (unsigned)delta); strcat(prefix, pre2);
            }
            id(last_trame_ms) = (int)now;
            id(last_rid) = id;
            id(first_trame_done) = true;
            const char* name = "?";
            if (id == 0x01) { name = "Chauffage"; snprintf(extra, sizeof(extra), " %s", data ? "ON" : "OFF"); }
            else if (id == 0x02) { name = "Filtration"; snprintf(extra, sizeof(extra), " %s", data ? "ON" : "OFF"); }
            else if (id == 0x03) { name = "Bulles"; snprintf(extra, sizeof(extra), " lvl=%u", data); }
            else if (id == 0x04) { name = "Consigne"; snprintf(extra, sizeof(extra), " %.1fC", data / 2.0f); }
            else if (id == 0x06) { name = "Temp"; snprintf(extra, sizeof(extra), " %.1fC", data / 2.0f); }
            else if (id == 0x08) { name = "0x08(SPA)"; }
            else if (id == 0x0D) { name = "Poll"; }
            else if (id == 0x15) { name = "Sanitize"; }
            else if (id == 0x19) { name = "UVC"; snprintf(extra, sizeof(extra), " %s", data ? "ON" : "OFF"); }
            else if (id == 0x1A) {
              name = "Flags";
              snprintf(extra, sizeof(extra), " 0x%02X (Pump=%u Heat=%u Pret=%u)", data, (data>>0)&1, (data>>1)&1, (data>>3)&1);
            }
            else { snprintf(extra, sizeof(extra), " ID=0x%02X DATA=0x%02X", id, data); }
            snprintf(buf, sizeof(buf), "%s[%s] A5 %02X %02X %02X  %s%s", prefix, dir_str, id, data, cs, name, extra);
            ESP_LOGI("mspa", "%s", buf);
            id(last_trame).publish_state(std::string(buf));
  - id: uart_clavier
    tx_pin: 13
    rx_pin: 14
    baud_rate: 9600
    rx_buffer_size: 1024
    debug:
      direction: BOTH
      after: { bytes: 4 }
      sequence:
        - lambda: |-
            if (bytes.size() != 4 || bytes[0] != 0xA5) {
              UARTDebug::log_hex(direction, bytes, ' ');
              return;
            }
            uint8_t id = bytes[1], data = bytes[2], cs = bytes[3];
            uint8_t expect_cs = (0xA5 + id + data) & 0xFF;
            const char* dir_str = (direction == 0) ? "CLAV->SPA" : "SPA->CLAV";
            char buf[96];
            char extra[32] = "";
            if (expect_cs != cs) {
              snprintf(buf, sizeof(buf), "[%s] A5 %02X %02X %02X (checksum ERR)", dir_str, id, data, cs);
              ESP_LOGI("mspa", "%s", buf);
              id(last_trame).publish_state(std::string(buf));
              return;
            }
            uint32_t now = millis();
            char prefix[48] = "";
            if (!id(first_trame_done)) { strcat(prefix, "[BOOT] "); id(first_trame_done) = true; }
            if (id(last_rid) == 0x0D) strcat(prefix, "[apres 0x0D] ");
            if (id(first_trame_done)) {
              uint32_t delta = now - (uint32_t)id(last_trame_ms);
              char pre2[20]; snprintf(pre2, sizeof(pre2), "[+%ums] ", (unsigned)delta); strcat(prefix, pre2);
            }
            id(last_trame_ms) = (int)now;
            id(last_rid) = id;
            id(first_trame_done) = true;
            const char* name = "?";
            if (id == 0x01) { name = "Chauffage"; snprintf(extra, sizeof(extra), " %s", data ? "ON" : "OFF"); }
            else if (id == 0x02) { name = "Filtration"; snprintf(extra, sizeof(extra), " %s", data ? "ON" : "OFF"); }
            else if (id == 0x03) { name = "Bulles"; snprintf(extra, sizeof(extra), " lvl=%u", data); }
            else if (id == 0x04) { name = "Consigne"; snprintf(extra, sizeof(extra), " %.1fC", data / 2.0f); }
            else if (id == 0x06) { name = "Temp"; snprintf(extra, sizeof(extra), " %.1fC", data / 2.0f); }
            else if (id == 0x08) { name = "0x08(SPA)"; }
            else if (id == 0x0D) { name = "Poll"; }
            else if (id == 0x15) { name = "Sanitize"; }
            else if (id == 0x19) { name = "UVC"; snprintf(extra, sizeof(extra), " %s", data ? "ON" : "OFF"); }
            else if (id == 0x1A) {
              name = "Flags";
              snprintf(extra, sizeof(extra), " 0x%02X (Pump=%u Heat=%u Idle=%u)", data, (data>>0)&1, (data>>1)&1, (data>>3)&1);
            }
            else { snprintf(extra, sizeof(extra), " ID=0x%02X DATA=0x%02X", id, data); }
            snprintf(buf, sizeof(buf), "%s[%s] A5 %02X %02X %02X  %s%s", prefix, dir_str, id, data, cs, name, extra);
            ESP_LOGI("mspa", "%s", buf);
            id(last_trame).publish_state(std::string(buf));

# Pont transparent (aucune injection, 100 % relais) : on relaie tout (comme le contrôleur) pour que le spa/clavier
# fonctionnent, tout en laissant uart_debug capturer les trames.
interval:
  - interval: 1ms
    then:
      - lambda: |-
          uint8_t c;
          while (id(uart_spa).available()) {
            if (id(uart_spa).read_byte(&c)) id(uart_clavier).write_byte(c);
          }
          while (id(uart_clavier).available()) {
            if (id(uart_clavier).read_byte(&c)) id(uart_spa).write_byte(c);
          }
  - interval: 12s
    then:
      - lambda: |-
          int step = id(auto_step);
          if (step == 1) {
            uint8_t f[4] = { 0xA5, 0x02, 0x01, (uint8_t)((0xA5 + 0x02 + 0x01) & 0xFF) };
            id(uart_spa).write_array(f, 4);
            ESP_LOGW("mspa", ">>> INJECT AUTO: Filtration ON <<<");
          } else if (step == 2) {
            uint8_t f[4] = { 0xA5, 0x01, 0x01, (uint8_t)((0xA5 + 0x01 + 0x01) & 0xFF) };
            id(uart_spa).write_array(f, 4);
            ESP_LOGW("mspa", ">>> INJECT AUTO: Chauffage ON <<<");
          } else if (step == 3) {
            uint8_t f[4] = { 0xA5, 0x01, 0x00, (uint8_t)((0xA5 + 0x01 + 0x00) & 0xFF) };
            id(uart_spa).write_array(f, 4);
            ESP_LOGW("mspa", ">>> INJECT AUTO: Chauffage OFF <<<");
          } else if (step == 4) {
            uint8_t f[4] = { 0xA5, 0x02, 0x00, (uint8_t)((0xA5 + 0x02 + 0x00) & 0xFF) };
            id(uart_spa).write_array(f, 4);
            ESP_LOGW("mspa", ">>> INJECT AUTO: Filtration OFF <<<");
          }
          if (step < 5) id(auto_step) += 1;
