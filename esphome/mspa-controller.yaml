# Contrôleur MSPA – Pont UART + eedomus
# Référence : docs/protocol_mspa.md, docs/logic_spec.md

esphome:
  name: mspa-final-controller
  on_loop:
    then:
      - lambda: |-
          // --- LOGIQUE UART (Clavier & Spa) ---
          static uint8_t c_buf[4], c_idx = 0;
          static uint8_t last_c_f = 0, last_c_h = 0, last_c_b = 0, last_c_uvc = 0;
          while (id(uart_clavier).available()) {
            uint8_t c; id(uart_clavier).read_byte(&c);
            c_buf[c_idx++] = c;
            if (c_idx == 4) {
              if (c_buf[0] == 0xA5) {
                uint8_t rid = c_buf[1]; uint8_t rd = c_buf[2];
                if (rid == 0x01 && rd != last_c_h) { id(sw_h).publish_state(rd == 0x01); last_c_h = rd; }
                else if (rid == 0x02 && rd != last_c_f) { id(sw_f).publish_state(rd == 0x01); last_c_f = rd; }
                else if (rid == 0x19 && rd != last_c_uvc) { id(sw_uvc).publish_state(rd == 0x01); last_c_uvc = rd; }
                else if (rid == 0x03 && rd != last_c_b) {
                  if (rd == 0) id(sel_b).publish_state("Arret");
                  else if (rd == 1) id(sel_b).publish_state("Niveau1");
                  else if (rd == 2) id(sel_b).publish_state("Niveau2");
                  else if (rd == 3) id(sel_b).publish_state("Niveau3");
                  last_c_b = rd;
                }
                if (rid == 0x01)      c_buf[2] = id(sw_h).state ? 0x01 : 0x00;
                else if (rid == 0x02) c_buf[2] = (id(sw_f).state || id(sw_h).state || id(sw_uvc).state) ? 0x01 : 0x00;
                else if (rid == 0x19) c_buf[2] = id(sw_uvc).state ? 0x01 : 0x00;
                else if (rid == 0x03) {
                   auto opt = id(sel_b).current_option();
                   if (opt == "Niveau1") c_buf[2] = 0x01;
                   else if (opt == "Niveau2") c_buf[2] = 0x02;
                   else if (opt == "Niveau3") c_buf[2] = 0x03;
                   else c_buf[2] = 0x00;
                }
                c_buf[3] = c_buf[0] + c_buf[1] + c_buf[2];
                if (!id(lock).state) id(uart_spa).write_array(c_buf, 4);
              }
              c_idx = 0;
            }
          }
          static uint8_t s_buf[4], s_idx = 0;
          while (id(uart_spa).available()) {
            uint8_t sc; id(uart_spa).read_byte(&sc);
            id(uart_clavier).write_byte(sc);
            s_buf[s_idx++] = sc;
            if (s_idx == 4 && s_buf[0] == 0xA5) {
              if (s_buf[1] == 0x06) id(cur_temp).publish_state(s_buf[2] / 2.0);
              if (s_buf[1] == 0x1A) {
                 id(f_st).publish_state(s_buf[2] & 0x01);
                 id(h_st).publish_state(s_buf[2] & 0x02);
                 id(b_st).publish_state(s_buf[2] & 0x04);
              }
              s_idx = 0;
            } else if (s_idx >= 4) s_idx = 0;
          }

esp32:
  board: esp32dev
  framework: { type: arduino }

wifi:
  networks:
    - ssid: "l'escalade-secours"
      password: "Qt51HhAz"
  ap: { ssid: "MSPA-RECOVERY" }

ota:
  platform: esphome

http_request:
  useragent: "Mozilla/5.0"
  timeout: 5s
  verify_ssl: false

logger:
  level: INFO
  baud_rate: 0

web_server:
  port: 80

uart:
  - id: uart_spa
    tx_pin: 17
    rx_pin: 16
    baud_rate: 9600
  - id: uart_clavier
    tx_pin: 13
    rx_pin: 14
    baud_rate: 9600

script:
  - id: push_eedomus
    mode: queued
    parameters:
      p_id: int
      p_val: int
    then:
      - http_request.get:
          url: !lambda |-
            char url[256];
            sprintf(url, "http://192.168.1.242/api/set?api_user=X83Euu&api_secret=cl6xma3bQfZMzIlW&action=periph.value&periph_id=%d&value=%d", p_id, p_val);
            return url;

  - id: push_temp_eedomus
    mode: single
    parameters:
      p_id: int
      p_val: float
    then:
      - http_request.get:
          url: !lambda |-
            char url[256];
            sprintf(url, "http://192.168.1.242/api/set?api_user=X83Euu&api_secret=cl6xma3bQfZMzIlW&action=periph.value&periph_id=%d&value=%.1f", p_id, p_val);
            return url;

switch:
  - platform: template
    name: "sw_f"
    id: sw_f
    optimistic: true
    on_turn_on:  { then: [ script.execute: { id: push_eedomus, p_id: 3527369, p_val: 100 } ] }
    on_turn_off: { then: [ script.execute: { id: push_eedomus, p_id: 3527369, p_val: 0 } ] }
  - platform: template
    name: "sw_h"
    id: sw_h
    optimistic: true
    on_turn_on:  { then: [ script.execute: { id: push_eedomus, p_id: 3527370, p_val: 100 } ] }
    on_turn_off: { then: [ script.execute: { id: push_eedomus, p_id: 3527370, p_val: 0 } ] }
  - platform: template
    name: "sw_uvc"
    id: sw_uvc
    optimistic: true
    on_turn_on:  { then: [ script.execute: { id: push_eedomus, p_id: 3527372, p_val: 100 } ] }
    on_turn_off: { then: [ script.execute: { id: push_eedomus, p_id: 3527372, p_val: 0 } ] }
  - platform: template
    name: "lock"
    id: lock
    optimistic: true
    on_turn_on:  { then: [ script.execute: { id: push_eedomus, p_id: 3527373, p_val: 100 } ] }
    on_turn_off: { then: [ script.execute: { id: push_eedomus, p_id: 3527373, p_val: 0 } ] }

select:
  - platform: template
    name: "sel_b"
    id: sel_b
    options: ["Arret", "Niveau1", "Niveau2", "Niveau3"]
    optimistic: true
    set_action:
      then:
        - lambda: |-
            int val = 0;
            if (x == "Niveau1") val = 1;
            else if (x == "Niveau2") val = 2;
            else if (x == "Niveau3") val = 3;
            id(push_eedomus).execute(3527371, val);

sensor:
  - platform: template
    name: "temp"
    id: cur_temp
    unit_of_measurement: "°C"
    update_interval: never
    on_value:
      then:
        - script.execute: { id: push_temp_eedomus, p_id: 3527361, p_val: !lambda "return x;" }

binary_sensor:
  - platform: template
    name: "stat_f"
    id: f_st
  - platform: template
    name: "stat_h"
    id: h_st
  - platform: template
    name: "stat_b"
    id: b_st
