substitutions:
  mspa_version: "v7.7.7-PROD"
  eedomus_enabled: "false"
  eedomus_host: !secret eedomus_host
  eedomus_api_user: !secret eedomus_api_user
  eedomus_api_secret: !secret eedomus_api_secret
  static_ip: !secret static_ip
  gateway: !secret gateway
  subnet: !secret subnet
  periph_filtration: !secret eedomus_periph_filtration
  periph_chauffage: !secret eedomus_periph_chauffage
  periph_bulles: !secret eedomus_periph_bulles
  periph_uvc: !secret eedomus_periph_uvc
  periph_verrouillage: !secret eedomus_periph_verrouillage
  periph_consigne_temp: !secret eedomus_periph_consigne_temp
  periph_temp_eau: !secret eedomus_periph_temp_eau
  periph_alerte_filtre: !secret eedomus_periph_alerte_filtre
  eedomus_throttle: 5s
  ap_ssid: !secret ap_ssid
  ap_password: !secret ap_password

esphome:
  name: mspa-controller
  friendly_name: MSPA ${mspa_version}
  min_version: 2024.12.2
  build_path: build\mspa-controller

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway}
    subnet: ${subnet}
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

ota:
  - platform: esphome

api:
  reboot_timeout: 0s

web_server:
  port: 80

logger:
  level: DEBUG
  baud_rate: 115200

external_components:
  - source:
      type: local
      path: components
    components: [ mspa_uart ]

uart:
  - id: uart_spa
    tx_pin: 17
    rx_pin: 16
    baud_rate: 9600
    rx_buffer_size: 256
  - id: uart_kbd
    tx_pin: 18
    rx_pin: 19
    baud_rate: 9600
    rx_buffer_size: 256

mspa_uart:
  id: mspa_logic
  uart_spa: uart_spa
  uart_kbd: uart_kbd

sensor:
  - platform: template
    name: "Temperature Eau"
    id: cur_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "Temperature Consigne"
    id: cur_setpoint
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    name: "Bulles"
    id: cur_bubbles

binary_sensor:
  - platform: template
    name: "Alerte Filtre"
    id: filt_alert
    device_class: problem

switch:
  - platform: template
    name: "Filtration"
    id: sw_f
    optimistic: true
    turn_on_action: [ lambda: id(mspa_logic)->control_filtration(true); ]
    turn_off_action: [ lambda: id(mspa_logic)->control_filtration(false); ]
  - platform: template
    name: "Chauffage"
    id: sw_h
    optimistic: true
    turn_on_action: [ lambda: id(mspa_logic)->control_heating(true); ]
    turn_off_action: [ lambda: id(mspa_logic)->control_heating(false); ]
  - platform: template
    name: "UVC"
    id: sw_u
    optimistic: true
    turn_on_action: [ lambda: id(mspa_logic)->control_uvc(true); ]
    turn_off_action: [ lambda: id(mspa_logic)->control_uvc(false); ]

select:
  - platform: template
    name: "Mode Bulles"
    id: sel_b
    options: ["Arret", "Niveau1", "Niveau2", "Niveau3"]
    optimistic: true
    set_action:
      - lambda: |-
          uint8_t val = (x == "Niveau1")?1:(x == "Niveau2")?2:(x == "Niveau3")?3:0;
          id(mspa_logic)->control_bubbles(val);

number:
  - platform: template
    name: "Temperature Consigne"
    id: test_setpoint
    min_value: 20
    max_value: 40
    step: 1
    optimistic: true
    set_action:
      - lambda: |-
          uint8_t val = (uint8_t)(x * 2.0f);
          id(mspa_logic)->inject_cmd(0x04, val);
