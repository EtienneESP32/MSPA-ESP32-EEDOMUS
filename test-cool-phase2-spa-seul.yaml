# Phase 2 : SPA SEUL — pas de clavier branché (pins 13/14 libres)
# Brancher uniquement le SPA sur pins 16 (RX) / 17 (TX) via level shifter.
# L'ESP32 simule le clavier en répondant A5:08:00:AD à chaque A5:06:27:D2.

esphome:
  name: test-cool
  friendly_name: Test ESP32 - Phase 2 SPA seul

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "abc123"

wifi:
  ssid: "Maison"
  password: "Maison/Babeuf/Besace@39"

uart:
  - id: uart_spa
    tx_pin: 17
    rx_pin: 16
    baud_rate: 9600
    stop_bits: 1
    rx_buffer_size: 512
    debug:
      direction: BOTH
      after:
        bytes: 4
      sequence:
        - lambda: UARTDebug::log_hex(direction, bytes, ':');

# Mock clavier : à chaque A5:06:27:D2 reçu, on envoie A5:08:00:AD
interval:
  - interval: 1ms
    then:
      - lambda: |-
          static uint8_t buf[4];
          static int len = 0;
          uint8_t c;
          while (id(uart_spa).available() && id(uart_spa).read_byte(&c)) {
            if (len < 4) { buf[len++] = c; }
            if (len == 4) {
              if (buf[0]==0xA5 && buf[1]==0x06 && buf[2]==0x27 && buf[3]==0xD2) {
                id(uart_spa).write_byte(0xA5);
                id(uart_spa).write_byte(0x08);
                id(uart_spa).write_byte(0x00);
                id(uart_spa).write_byte(0xAD);
              }
              len = 0;
            }
          }

switch:
  - platform: gpio
    pin:
      number: GPIO2
      inverted: true
    id: led_mspa
    name: "ESP32 Vivant"
