esphome:
  name: ble-spa-sniff
  friendly_name: BLE Spa Sniffer

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: "MY_WIFI_SSID"
  password: "MY_WIFI_PASSWORD"

logger:
  level: INFO

api: {}
ota:
  platform: esphome
  password: "MY_OTA_PASSWORD"

web_server:
  port: 80

esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: true
