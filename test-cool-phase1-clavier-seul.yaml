# Phase 1 : CLAVIER SEUL — pas de SPA branché (pins 16/17 libres)
# Brancher uniquement le clavier sur pins 13 (RX) / 14 (TX) via level shifter.
# L'ESP32 simule le SPA en répondant A5:06:27:D2 à chaque A5:08:00:AD.

esphome:
  name: test-cool
  friendly_name: Test ESP32 - Phase 1 Clavier seul

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG  # pour voir uart_debug

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "MY_OTA_PASSWORD"

wifi:
  ssid: "MY_WIFI_SSID"
  password: "MY_WIFI_PASSWORD"

uart:
  - id: uart_clavier
    tx_pin: 14
    rx_pin: 13
    baud_rate: 9600
    stop_bits: 1
    rx_buffer_size: 512
    debug:
      direction: BOTH
      after:
        bytes: 4
      sequence:
        - lambda: UARTDebug::log_hex(direction, bytes, ':');

# Mock SPA : à chaque A5:08:00:AD reçu, on envoie A5:06:27:D2
interval:
  - interval: 1ms
    then:
      - lambda: |-
          static uint8_t buf[4];
          static int len = 0;
          uint8_t c;
          while (id(uart_clavier).available() && id(uart_clavier).read_byte(&c)) {
            if (len < 4) { buf[len++] = c; }
            if (len == 4) {
              if (buf[0]==0xA5 && buf[1]==0x08 && buf[2]==0x00 && buf[3]==0xAD) {
                id(uart_clavier).write_byte(0xA5);
                id(uart_clavier).write_byte(0x06);
                id(uart_clavier).write_byte(0x27);
                id(uart_clavier).write_byte(0xD2);
              }
              len = 0;
            }
          }

switch:
  - platform: gpio
    pin:
      number: GPIO2
      inverted: true
    id: led_mspa
    name: "ESP32 Vivant"
