# Controleur MSPA – Version 7.5.40-DR (Disaster Recovery)
# [PHILOSOPHIE] Shunt Logique Transparent / Mute Mode / Priorité Web
# [RELAIS] Octet par octet (Zéro latence)
# [SECURITE] Eedomus bridé pour protéger l'accès Web

substitutions:
  mspa_version: "7.5.40-DR"
  eedomus_enabled: "false"  # Sécurité : On démarre en silence total
  # Utilise les mêmes secrets que la PROD pour la connectivité
  eedomus_host: !secret eedomus_host
  eedomus_api_user: !secret eedomus_api_user
  eedomus_api_secret: !secret eedomus_api_secret
  static_ip: !secret static_ip
  gateway: !secret gateway
  subnet: !secret subnet
  periph_temp_eau: !secret eedomus_periph_temp_eau
  # On réduit drastiquement la fréquence de push pour libérer les sockets
  eedomus_throttle: "60s" 
  ap_ssid: !secret ap_ssid
  ap_password: !secret ap_password

external_components:
  - source:
      type: local
      path: components
    components: [ mspa_bridge ] # On pointe sur le composant isolé

mspa_bridge:
  id: mspa_logic
  uart_spa: uart_spa
  uart_kbd: uart_kbd

esphome:
  name: mspa-controller-dr
  friendly_name: MSPA v${mspa_version} (BRIDGE)
  on_boot:
    priority: 800
    then:
      - lambda: |-
          id(mspa_logic)->set_temp_sensor(id(cur_temp));
          id(mspa_logic)->set_setpoint_sensor(id(consigne_temperature));
          id(mspa_logic)->set_filter_alert_sensor(id(filt_alert));
          id(mspa_logic)->set_f_switch(id(filtration));
          id(mspa_logic)->set_h_switch(id(chauffage));
          id(mspa_logic)->set_u_switch(id(uvc));
          id(mspa_logic)->set_b_select(id(mode_bulles));
          id(mspa_logic)->set_link_sensor(id(motor_link));
          id(mspa_logic)->set_kbd_link_sensor(id(kbd_link));
          id(mspa_logic)->set_eedomus_enabled(${eedomus_enabled});
          id(mspa_logic)->set_eedomus_callback([=](int p_id, float p_val, bool p_f) {
            App.scheduler.set_timeout(id(mspa_logic), "push_eedomus", 0, [=]() {
              id(script_push_eedomus).execute(p_id, p_val, p_f);
            });
          });

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  power_save_mode: none # Performance max pour garder la main
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip:
        static_ip: ${static_ip}
        gateway: ${gateway}
        subnet: ${subnet}
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

api:
  reboot_timeout: 0s # Interdiction de rebooter (Protection du Pont UART)

ota:
  - platform: esphome

http_request:
  useragent: esphome/mspa-dr
  timeout: 5s
  verify_ssl: false

logger:
  level: INFO # Niveau global pour permettre le diag
  baud_rate: 0
  logs:
    mspa_bridge: INFO 
    api: WARN
    wifi: WARN
    main: WARN

web_server:
  port: 80

uart:
  - id: uart_spa
    tx_pin: 17
    rx_pin: 16
    baud_rate: 9600
    rx_buffer_size: 1024
  - id: uart_kbd
    tx_pin: 13
    rx_pin: 14
    baud_rate: 9600
    rx_buffer_size: 1024

# Liste des capteurs (Identique GOLD pour garder la visibilité)
sensor:
  - platform: template
    id: cur_temp
    name: "Temperature Eau (DIAG)"
    unit_of_measurement: "°C"
    update_interval: never
    accuracy_decimals: 1
    lambda: 'return id(mspa_logic)->get_current_temp();'

binary_sensor:
  - platform: template
    name: "Alerte Filtre (DIAG)"
    id: filt_alert
    device_class: problem
  - platform: template
    name: "Lien Moteur"
    id: motor_link
    device_class: connectivity
  - platform: template
    name: "Lien Clavier"
    id: kbd_link
    device_class: connectivity

# Switches en mode LECTURE SEULE (Consultatif)
switch:
  - platform: template
    name: "Filtration (ETAT)"
    id: filtration
    optimistic: false
    turn_on_action: []
    turn_off_action: []
  - platform: template
    name: "Chauffage (ETAT)"
    id: chauffage
    optimistic: false
    turn_on_action: []
    turn_off_action: []
  - platform: template
    name: "UVC (ETAT)"
    id: uvc
    optimistic: false
    turn_on_action: []
    turn_off_action: []
  - platform: template
    name: "Lien Eedomus"
    id: eedomus_link_switch
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(mspa_logic)->set_eedomus_enabled(true);'
    on_turn_off:
      - lambda: 'id(mspa_logic)->set_eedomus_enabled(false);'

select:
  - platform: template
    name: "Mode Bulles (ETAT)"
    id: mode_bulles
    options: ["Arret", "Niveau1", "Niveau2", "Niveau3"]
    optimistic: false
    set_action: []

number:
  - platform: template
    name: "Consigne (ETAT)"
    id: consigne_temperature
    min_value: 20
    max_value: 40
    step: 1.0
    set_action: []

script:
  - id: script_push_eedomus
    mode: single
    parameters:
      p_id: int
      p_val: float
      p_f: bool
    then:
      - http_request.send:
          method: GET
          url: !lambda |-
            char url[256];
            std::string host = "${eedomus_host}";
            sprintf(url, "http://%s/api/set?api_user=${eedomus_api_user}&api_secret=${eedomus_api_secret}&action=periph.value&periph_id=%d&value=%.1f", host.c_str(), p_id, p_val);
            return url;
          on_response:
            lambda: 'id(mspa_logic)->set_http_busy(false);'
          on_error:
            lambda: 'id(mspa_logic)->set_http_busy(false);'

interval:
  - interval: 1s
    then:
      - lambda: 'id(mspa_logic)->run_watchdog();'
  - interval: 1h
    then:
      - logger.log:
          format: "DR-Heartbeat (Heap: %u)"
          args: ["esp_get_free_heap_size()"]
